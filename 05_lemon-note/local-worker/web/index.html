<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>회의녹음챗 — 녹음 · 전사 · 요약</title>
<meta name="description" content="회의를 녹음하거나 업로드하면 전사와 요약을 자동으로 생성하고, 검토·수정·공유까지 한 곳에서 처리하는 데모 도구입니다." />
<link rel="icon" href="data:," />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app-shell" id="app-shell" data-route="new">

  <nav class="icon-rail" aria-label="주요 메뉴">
    <a href="#/home" class="rail-logo" aria-label="회의녹음챗 홈">
      <svg width="18" height="18" viewBox="0 0 22 22" fill="none" aria-hidden="true">
        <rect class="rail-logo-bar" x="2" y="8" width="3.2" height="10" rx="1.4" fill="#191f28"/>
        <rect class="rail-logo-bar" x="7.4" y="4" width="3.2" height="14" rx="1.4" fill="#191f28"/>
        <rect class="rail-logo-bar" x="12.8" y="1" width="3.2" height="17" rx="1.4" fill="#191f28"/>
        <rect class="rail-logo-bar" x="18.2" y="6" width="3.2" height="12" rx="1.4" fill="#191f28"/>
      </svg>
    </a>
    <a href="#/new" class="rail-compose" title="새 회의" aria-label="새 회의 녹음 또는 업로드">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </a>
    <div class="rail-nav" id="rail-nav">
      <a href="#/home" class="rail-btn" data-nav="home" title="홈" aria-label="홈">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 9.5L10 3l7 6.5M5 8.5V16a1 1 0 001 1h3v-4h2v4h3a1 1 0 001-1V8.5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </a>
      <a href="#/folders" class="rail-btn" data-nav="folders" title="폴더" aria-label="폴더">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M2.5 6A1.5 1.5 0 014 4.5h3l1.6 2h5.9A1.5 1.5 0 0116 8v6.5a1.5 1.5 0 01-1.5 1.5h-9A1.5 1.5 0 014 14.5V6z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </a>
      <a href="#/calendar" class="rail-btn" data-nav="calendar" title="달력" aria-label="녹음 달력">
        <svg width="19" height="19" viewBox="0 0 19 19" fill="none" aria-hidden="true"><rect x="2.5" y="4" width="14" height="12.5" rx="2.3" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 7.8h14" stroke="currentColor" stroke-width="1.5"/><path d="M6.3 2.2v3M12.7 2.2v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><rect x="5.6" y="10.1" width="2.7" height="2.7" rx="0.6" fill="currentColor"/></svg>
      </a>
      <a href="#/me" class="rail-btn" data-nav="me" title="마이" aria-label="마이 페이지">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="6.4" r="3.1" stroke="currentColor" stroke-width="1.5"/><path d="M4 16.5c0-3.1 2.7-5 6-5s6 1.9 6 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </a>
    </div>
    <div class="rail-spacer"></div>
  </nav>

  <aside class="col-list" id="col-list" aria-label="회의 목록"></aside>

  <main class="col-center" id="col-center" aria-live="polite"></main>

  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="col-right" id="col-right" aria-label="참석자 및 요약">
    <button type="button" class="drawer-close-btn" id="drawer-close-btn" aria-label="패널 닫기"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <div class="col-right-content" id="col-right-content"></div>
  </aside>

  <nav class="tab-bar" aria-label="주요 메뉴">
    <a href="#/home" class="tab-btn" data-nav="home">
      <svg width="22" height="22" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 9.5L10 3l7 6.5M5 8.5V16a1 1 0 001 1h3v-4h2v4h3a1 1 0 001-1V8.5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <span>홈</span>
    </a>
    <a href="#/folders" class="tab-btn" data-nav="folders">
      <svg width="22" height="22" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M2.5 6A1.5 1.5 0 014 4.5h3l1.6 2h5.9A1.5 1.5 0 0116 8v6.5a1.5 1.5 0 01-1.5 1.5h-9A1.5 1.5 0 014 14.5V6z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <span>폴더</span>
    </a>
    <a href="#/calendar" class="tab-btn" data-nav="calendar">
      <svg width="22" height="22" viewBox="0 0 19 19" fill="none" aria-hidden="true"><rect x="2.5" y="4" width="14" height="12.5" rx="2.3" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 7.8h14" stroke="currentColor" stroke-width="1.5"/><path d="M6.3 2.2v3M12.7 2.2v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><rect x="5.6" y="10.1" width="2.7" height="2.7" rx="0.6" fill="currentColor"/></svg>
      <span>달력</span>
    </a>
    <a href="#/me" class="tab-btn" data-nav="me">
      <svg width="22" height="22" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="6.4" r="3.1" stroke="currentColor" stroke-width="1.5"/><path d="M4 16.5c0-3.1 2.7-5 6-5s6 1.9 6 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>마이</span>
    </a>
  </nav>
  <button type="button" class="tab-fab" id="tab-fab" aria-haspopup="menu" aria-expanded="false" aria-controls="fab-menu" aria-label="새 회의">
    <svg width="24" height="24" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
  <div class="fab-menu" id="fab-menu" role="menu" aria-labelledby="tab-fab" hidden>
    <button type="button" class="fab-menu-item" role="menuitem" data-action="tt-fab-record">녹음 시작</button>
    <button type="button" class="fab-menu-item" role="menuitem" data-action="tt-fab-upload">파일 업로드</button>
  </div>

</div>

<div class="toast-stack" id="toast-stack" aria-live="assertive" aria-atomic="false"></div>

<!-- 범용 확인 다이얼로그 -->
<dialog id="confirm-dialog" class="modal">
  <div class="modal-pad">
    <div class="modal-title" id="confirm-dialog-title">확인</div>
    <div class="modal-body" id="confirm-dialog-body"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="confirm-dialog-cancel">취소</button>
      <button type="button" class="btn btn-danger" id="confirm-dialog-ok">확인</button>
    </div>
  </div>
</dialog>

<!-- Slack 공유 미리보기 다이얼로그 -->
<dialog id="slack-dialog" class="modal modal-wide">
  <div class="modal-pad">
    <div class="modal-title">Slack 공유 미리보기</div>
    <div class="modal-body">아래 내용이 지정한 채널로 전송됩니다. 실제 전송 전 마지막으로 확인하세요.</div>
    <div class="field mt-16">
      <label class="field-label" for="slack-channel-input">채널 라벨 <span class="field-hint">(데모에서는 표시용이며, 실제 전송 채널은 서버의 Webhook 설정을 따릅니다)</span></label>
      <input type="text" id="slack-channel-input" class="input" placeholder="예: #product" />
    </div>
    <div class="field">
      <label class="field-label" for="slack-preview-text">전송될 메시지</label>
      <div class="share-preview-block" id="slack-preview-text"></div>
    </div>
    <div id="slack-result-area"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="slack-dialog-cancel">닫기</button>
      <button type="button" class="btn btn-primary" id="slack-dialog-send">Slack으로 전송</button>
    </div>
  </div>
</dialog>

<dialog id="folder-picker" class="modal">
  <div class="modal-pad">
    <div class="modal-title">폴더로 이동</div>
    <div class="modal-body">이 노트를 옮길 폴더를 선택하세요.</div>
    <div class="folder-picker-list" id="folder-picker-list"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="folder-picker-cancel">취소</button>
    </div>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
