# 로컬 개발 인프라 — Postgres 16 + Redis 7.
#
# 사용:
#   docker compose up -d
#   cd backend && alembic upgrade head
#
# Reference:
#   /Users/yeong/.claude/plans/lemon-track-b/phase-04-database-models.md Step 1
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lemon
      POSTGRES_USER: lemon
      POSTGRES_PASSWORD: devonly
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lemon"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg-data:
