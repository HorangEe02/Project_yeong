include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated_plugin_registrant.dart"
    - build/**

linter:
  rules:
    # mobile/CLAUDE.md 명시 타입 선호 — very_good_analysis omit 룰 비활성
    omit_local_variable_types: false
    # 상대 import 허용 (이 코드베이스 일관성)
    always_use_package_imports: false
    # 카테고리별 그루핑 유지
    sort_pub_dependencies: false
    # multi-line string 가독성
    missing_whitespace_between_adjacent_strings: false
    # super.key 뒤에 required named 허용
    always_put_required_named_parameters_first: false
    # 디폴트값 명시는 의도 — false positive 회피
    avoid_redundant_argument_values: false
    # 코드 ignore 주석 강제 X
    document_ignores: false
    # 문서화 강제 X (한국어 docstring 사용)
    public_member_api_docs: false
    # 80자 강제 X
    lines_longer_than_80_chars: false
