name: lemon_healthcare
description: "만성질환자 중심의 AI 헬스케어 플랫폼 - Vision Nutrition"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # 상태 관리 (Riverpod 코드 생성)
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 라우팅
  go_router: ^14.2.0

  # 네트워크
  dio: ^5.4.0
  pretty_dio_logger: ^1.4.0   # 사용자 prompt 의 dio_logger → 실 패키지 pretty_dio_logger 로 정합

  # 데이터 모델 (코드 생성)
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1

  # 스토리지
  flutter_secure_storage: ^9.0.0

  # 카메라·이미지 (Phase M-3 에서 사용)
  image_picker: ^1.1.0
  image_cropper: ^7.0.0
  permission_handler: ^11.3.0

  # UI / 폰트
  google_fonts: ^6.2.0
  url_launcher: ^6.2.0

  # 유틸
  intl: ^0.19.0
  logger: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # 린트
  flutter_lints: ^4.0.0
  very_good_analysis: ^6.0.0

  # 코드 생성
  build_runner: ^2.4.10
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0
  freezed: ^2.5.0

  # 테스트
  mocktail: ^1.0.0
  patrol: ^3.6.0

flutter:
  uses-material-design: true
