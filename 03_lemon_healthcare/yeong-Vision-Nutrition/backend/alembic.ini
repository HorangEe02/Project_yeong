# Alembic configuration.
#
# sqlalchemy.url 은 alembic/env.py 에서 ``Settings.database_url`` 로 동적으로 주입한다.
# 본 파일에는 secret 을 두지 않는다.
#
# Reference:
#   /Users/yeong/.claude/plans/lemon-track-b/phase-04-database-models.md Step 8

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
