[project]
name = "lemon-healthcare-backend"
version = "0.1.0"
description = "Lemon Healthcare backend — OCR + Ollama + KDRIs nutrient analysis"
requires-python = ">=3.11"
readme = "../README.md"
license = {text = "Proprietary"}

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate
    "PL",   # pylint
    "RUF",  # ruff-specific
]
ignore = [
    "E501",     # line-length (black이 처리)
    "PLR0913",  # too-many-arguments
    "PLR2004",  # magic value (테스트에서 빈번)
    # 그리스 α 등 영양학 표준 단위(α-TE, μg, μg RAE 등)는 의도적 사용. 한국어 docstring·
    # 데이터 row와 동기화되어야 하므로 모호성 경고를 끈다.
    "RUF001",   # ambiguous unicode (Greek alpha, etc.)
    "RUF002",   # ambiguous unicode in docstring
    "RUF003",   # ambiguous unicode in comment
]

[tool.ruff.lint.per-file-ignores]
# Tests: magic values (assert ==), assert allowed, unused args via fixture,
# in-function imports for monkeypatch / lazy paths.
"tests/**/*.py" = ["PLR2004", "S101", "ARG", "PLC0415"]
"scripts/**/*.py" = ["T201", "PLC0415"]  # print + lazy import 허용

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["ollama.*", "google.cloud.*", "google.api_core.*", "magic.*", "passlib.*", "testcontainers.*", "alembic.*", "paddleocr.*", "paddle.*", "paddlex.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
addopts = """
    -ra
    --strict-markers
    --strict-config
    --cov=src
    --cov-report=term-missing
    --cov-fail-under=70
"""
markers = [
    "integration: requires external services (Postgres, Redis, Ollama)",
    "e2e: end-to-end scenarios across full stack",
    "performance: latency or throughput measurement",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/__init__.py", "src/main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
