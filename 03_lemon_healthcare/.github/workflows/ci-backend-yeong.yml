# =============================================================================
# Backend CI (yeong-Vision-Nutrition): Python (FastAPI) 코드 자동 검증
# 트리거: 03_lemon_healthcare/yeong-Vision-Nutrition/backend/** 변경 시
#
# 트랙 B Phase 00에서 추가. 기존 ci-backend.yml(pr1/backend 전용)과 별도.
#
# Reference:
#   /Users/yeong/.claude/plans/lemon-track-b/phase-00-bootstrap.md Step 8
# =============================================================================

name: Backend CI (yeong)

on:
  push:
    branches: [main, develop]
    paths:
      - '03_lemon_healthcare/yeong-Vision-Nutrition/backend/**'
      - '03_lemon_healthcare/.github/workflows/ci-backend-yeong.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - '03_lemon_healthcare/yeong-Vision-Nutrition/backend/**'
      - '03_lemon_healthcare/.github/workflows/ci-backend-yeong.yml'

jobs:
  quality:
    name: Lint, Type, Test, Audit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    defaults:
      run:
        working-directory: 03_lemon_healthcare/yeong-Vision-Nutrition/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 03_lemon_healthcare/yeong-Vision-Nutrition/backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Format check (Black)
        run: black --check src tests

      - name: Lint (Ruff)
        run: ruff check src tests

      - name: Type check (mypy --strict)
        run: mypy src --strict

      - name: Ollama tag verification (D5)
        run: python scripts/check_ollama_tags.py
        continue-on-error: true   # 외부 사이트 일시 다운 대비. 본 검증 실패는 lint 단계 별도 트래킹.

      - name: Test with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
        run: pytest --cov=src --cov-report=xml --cov-report=term-missing

      - name: Dependency security audit (pip-audit)
        run: pip-audit --strict --requirement requirements.txt
        continue-on-error: true   # base scaffold 단계 — 실패해도 빌드 통과 (이슈로 관리)
