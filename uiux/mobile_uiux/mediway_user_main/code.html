<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-surface-container-lowest/80 backdrop-blur-2xl text-primary font-sans tracking-tight font-medium shadow-xl shadow-primary/5">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors text-primary active:scale-95 duration-300">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<div class="text-xl font-bold tracking-tighter text-primary">MediWay</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full overflow-hidden hover:bg-surface-container-low transition-colors active:scale-95 duration-300">
<img alt="User profile" class="w-full h-full object-cover" data-alt="close up portrait of a young woman with a soft smile, natural lighting, professional headshot style" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBo4ymFVwdaffUzIDwMMwHrRaezu3-m8BkRf5AfMrxf62DEdQutEoVAMSfmBmzcb_C7byS1O3KlS8bIbz0PdDq3QQuVAaXxjUq8R2LNtdal2AGXEhIoBGNCrOkxq8uY9SPOyaQRbdvIHfMFcpCXUYxKtAs4CbwaXk1KGfWLbTBkMFwNCSGrmdPm7QZ-cn148lP-4XzOZNjKjBMTCAKzwy1885nDVck2gtNnAjMtdxM6kIHifEUiumNasBGRVWXC91duBWMwArrApeqI"/>
</button>
</header>
<!-- Main Content -->
<main class="flex-grow pt-24 px-6 max-w-2xl mx-auto w-full">
<div class="mb-8 text-center">
<h1 class="text-3xl font-display font-bold text-on-surface tracking-tight mb-2">Select Your Facility</h1>
<p class="text-on-surface-variant font-body text-base">Choose a MediWay location to access your records and schedule appointments.</p>
</div>
<!-- Search Bar -->
<div class="relative mb-8 group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant group-focus-within:text-primary transition-colors">search</span>
</div>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-high border-none rounded-xl text-on-surface placeholder-on-surface-variant focus:bg-surface-container-lowest focus:ring-0 focus:shadow-[0_8px_30px_rgba(0,78,159,0.08)] transition-all duration-300 font-body text-base" placeholder="Search hospitals or clinics..." type="text"/>
</div>
<!-- Hospital List -->
<div class="space-y-4">
<!-- Hospital Card 1 (Active/Selected Example) -->
<button class="w-full text-left bg-surface-container-lowest p-5 rounded-xl flex items-center gap-4 hover:shadow-[0_8px_30px_rgba(0,78,159,0.06)] transition-all duration-300 relative overflow-hidden group border border-outline-variant/15">
<div class="absolute inset-0 bg-gradient-to-r from-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
<div class="w-14 h-14 rounded-full bg-surface-container-low flex items-center justify-center shrink-0 overflow-hidden">
<span class="material-symbols-outlined text-3xl text-primary" style="font-variation-settings: 'FILL' 1;">local_hospital</span>
</div>
<div class="flex-grow">
<h3 class="font-headline font-semibold text-lg text-on-surface mb-1 group-hover:text-primary transition-colors">MediWay Central Hospital</h3>
<p class="font-label text-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">location_on</span>
                        Downtown Medical District
                    </p>
</div>
<div class="shrink-0 text-primary opacity-0 group-hover:opacity-100 transform translate-x-2 group-hover:translate-x-0 transition-all duration-300">
<span class="material-symbols-outlined">arrow_forward_ios</span>
</div>
</button>
<!-- Hospital Card 2 -->
<button class="w-full text-left bg-surface p-5 rounded-xl flex items-center gap-4 hover:bg-surface-container-lowest hover:shadow-[0_8px_30px_rgba(0,78,159,0.06)] transition-all duration-300 group border border-outline-variant/15">
<div class="w-14 h-14 rounded-full bg-surface-container-low flex items-center justify-center shrink-0 overflow-hidden">
<span class="material-symbols-outlined text-3xl text-primary" style="font-variation-settings: 'FILL' 1;">pediatrics</span>
</div>
<div class="flex-grow">
<h3 class="font-headline font-semibold text-lg text-on-surface mb-1 group-hover:text-primary transition-colors">MediWay North Clinic</h3>
<p class="font-label text-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">location_on</span>
                        Northside Suburbs
                    </p>
</div>
<div class="shrink-0 text-on-surface-variant opacity-0 group-hover:opacity-100 transform translate-x-2 group-hover:translate-x-0 transition-all duration-300">
<span class="material-symbols-outlined">arrow_forward_ios</span>
</div>
</button>
<!-- Hospital Card 3 -->
<button class="w-full text-left bg-surface p-5 rounded-xl flex items-center gap-4 hover:bg-surface-container-lowest hover:shadow-[0_8px_30px_rgba(0,78,159,0.06)] transition-all duration-300 group border border-outline-variant/15">
<div class="w-14 h-14 rounded-full bg-surface-container-low flex items-center justify-center shrink-0 overflow-hidden">
<span class="material-symbols-outlined text-3xl text-primary" style="font-variation-settings: 'FILL' 1;">emergency</span>
</div>
<div class="flex-grow">
<h3 class="font-headline font-semibold text-lg text-on-surface mb-1 group-hover:text-primary transition-colors">MediWay Emergency Center</h3>
<p class="font-label text-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">location_on</span>
                        Westside Access Road
                    </p>
</div>
<div class="shrink-0 text-on-surface-variant opacity-0 group-hover:opacity-100 transform translate-x-2 group-hover:translate-x-0 transition-all duration-300">
<span class="material-symbols-outlined">arrow_forward_ios</span>
</div>
</button>
<!-- Hospital Card 4 -->
<button class="w-full text-left bg-surface p-5 rounded-xl flex items-center gap-4 hover:bg-surface-container-lowest hover:shadow-[0_8px_30px_rgba(0,78,159,0.06)] transition-all duration-300 group border border-outline-variant/15">
<div class="w-14 h-14 rounded-full bg-surface-container-low flex items-center justify-center shrink-0 overflow-hidden">
<span class="material-symbols-outlined text-3xl text-primary" style="font-variation-settings: 'FILL' 1;">psychology</span>
</div>
<div class="flex-grow">
<h3 class="font-headline font-semibold text-lg text-on-surface mb-1 group-hover:text-primary transition-colors">MediWay Wellness Institute</h3>
<p class="font-label text-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">location_on</span>
                        East Park Campus
                    </p>
</div>
<div class="shrink-0 text-on-surface-variant opacity-0 group-hover:opacity-100 transform translate-x-2 group-hover:translate-x-0 transition-all duration-300">
<span class="material-symbols-outlined">arrow_forward_ios</span>
</div>
</button>
</div>
<div class="mt-10 flex justify-center pb-8">
<button class="flex items-center gap-2 text-primary font-medium hover:text-primary-container transition-colors">
<span class="material-symbols-outlined">map</span>

            </button>
</div>

<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-2.5 hover:text-primary transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined mb-1">home</span>
<span class="text-[11px] font-semibold tracking-wide uppercase">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-2.5 hover:text-primary transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined mb-1">calendar_today</span>
<span class="text-[11px] font-semibold tracking-wide uppercase">Schedule</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-2.5 hover:text-primary transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined mb-1">folder_managed</span>
<span class="text-[11px] font-semibold tracking-wide uppercase">Records</span>

<a class="flex flex-col items-center justify-center bg-primary/10 text-primary rounded-[1.25rem] px-5 py-2.5 active:scale-90 duration-200" href="#">

<span class="text-[11px] font-semibold tracking-wide uppercase">Profile</span>
</a>
