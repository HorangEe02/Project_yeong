<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MediWay Sanctuary - Senior Hub</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "surface-container-low": "#f3f3f5",
                        "on-secondary-container": "#fefcff",
                        "surface-container-highest": "#e2e2e4",
                        "on-tertiary-container": "#cdecff",
                        "background": "#f9f9fb",
                        "surface-container-high": "#e8e8ea",
                        "error-container": "#ffdad6",
                        "surface": "#f9f9fb",
                        "error": "#ba1a1a",
                        "tertiary-fixed": "#c1e8ff",
                        "tertiary": "#005673",
                        "on-primary-fixed": "#001b3e",
                        "outline": "#727784",
                        "outline-variant": "#c1c6d5",
                        "on-tertiary-fixed": "#001e2b",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#007094",
                        "on-surface": "#1a1c1d",

                        "primary-container": "#0066cc",
                        "inverse-surface": "#2f3132",
                        "surface-dim": "#d9dadc",
                        "primary-fixed-dim": "#aac7ff",
                        "on-tertiary-fixed-variant": "#004d67",
                        "primary-fixed": "#d7e3ff",
                        "on-background": "#1a1c1d",
                        "surface-variant": "#e2e2e4",
                        "surface-tint": "#005cba",
                        "on-secondary-fixed-variant": "#00458f",

                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter", "sans-serif"],
                        "display": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen pb-32 font-body selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<nav class="fixed top-0 w-full z-50 flex items-center justify-between px-8 py-4 bg-[#f9f9fb]/80 backdrop-blur-xl shadow-[0_40px_60px_rgba(0,78,159,0.06)] md:hidden">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="clinical_notes" style="font-variation-settings: 'FILL' 1;">clinical_notes</span>
<div class="flex flex-col">
<span class="text-2xl font-bold bg-gradient-to-r from-[#004e9f] to-[#0066cc] bg-clip-text text-transparent font-headline tracking-tight">MediWay Sanctuary</span>
<span class="text-label-md text-on-surface-variant font-medium">St. Jude Medical</span>
</div>
</div>
<div class="w-12 h-12 rounded-full overflow-hidden bg-surface-container-highest shadow-sm shrink-0">
<img alt="Medical Professional Profile" class="w-full h-full object-cover" data-alt="close-up portrait of a smiling older woman with silver hair wearing a soft blue cardigan in a bright naturally lit room" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBiniElpNo5uUgll5MsDiRc38Zc-QR815u-he2jvuOM3NvRueCxq6my1F3kGfp1j0kFxysEP4HvVdTAAcQYYUWlCBkyg_zK0gVWUYina8fM3V9ITddttWB4Xvxmkj9EXFvAxfpSG6fv8fCV2Yz_gkkHg651EI47GLvMdqSMku2p0W1_qZ9j9YulRtc5TUNcVZrgko0LtY9J_pZ5w1DBuszHcnacp9AJxRLYVfrDPTfFhnF6d0X4tOfOE8ykYhViBKIsy9bqiXKwAEjv"/>
</div>
</nav>
<!-- Main Content Area -->
<main class="pt-28 px-4 max-w-lg mx-auto flex flex-col gap-8 md:hidden">
<!-- Welcome / Greeting Header -->
<header class="text-center space-y-2 mt-4">
<h1 class="text-3xl font-bold text-on-surface font-headline tracking-tight">Good Morning, Robert.</h1>
<p class="text-xl text-on-surface-variant font-medium">How can we help you today?</p>
</header>
<!-- 2x2 Grid Actions -->
<section class="grid grid-cols-2 gap-4">
<!-- Book a Visit -->
<button class="bg-surface-container-lowest rounded-[1.5rem] p-6 flex flex-col items-center justify-center gap-4 shadow-[0_8px_30px_rgba(0,78,159,0.04)] hover:bg-surface-container-low transition-colors active:scale-95 duration-200 aspect-square">
<div class="w-20 h-20 rounded-full bg-primary-fixed flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-primary text-5xl" data-icon="calendar_month" style="font-variation-settings: 'FILL' 1;">calendar_month</span>
</div>
<span class="text-2xl font-bold text-on-surface text-center leading-tight">Book a Visit</span>
</button>
<!-- Find My Way -->
<button class="bg-surface-container-lowest rounded-[1.5rem] p-6 flex flex-col items-center justify-center gap-4 shadow-[0_8px_30px_rgba(0,78,159,0.04)] hover:bg-surface-container-low transition-colors active:scale-95 duration-200 aspect-square">
<div class="w-20 h-20 rounded-full bg-tertiary-fixed flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-tertiary text-5xl" data-icon="directions_walk" style="font-variation-settings: 'FILL' 1;">directions_walk</span>
</div>
<span class="text-2xl font-bold text-on-surface text-center leading-tight">Find My Way</span>
</button>
<!-- My Turn -->
<button class="bg-surface-container-lowest rounded-[1.5rem] p-6 flex flex-col items-center justify-center gap-4 shadow-[0_8px_30px_rgba(0,78,159,0.04)] hover:bg-surface-container-low transition-colors active:scale-95 duration-200 aspect-square">
<div class="w-20 h-20 rounded-full bg-secondary-fixed flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-secondary text-5xl" data-icon="pending_actions" style="font-variation-settings: 'FILL' 1;">pending_actions</span>
</div>
<span class="text-2xl font-bold text-on-surface text-center leading-tight">My Turn</span>
</button>
<!-- Doctor at Home -->
<button class="bg-surface-container-lowest rounded-[1.5rem] p-6 flex flex-col items-center justify-center gap-4 shadow-[0_8px_30px_rgba(0,78,159,0.04)] hover:bg-surface-container-low transition-colors active:scale-95 duration-200 aspect-square">
<div class="w-20 h-20 rounded-full bg-inverse-primary flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-primary text-5xl" data-icon="home_health" style="font-variation-settings: 'FILL' 1;">home_health</span>
</div>
<span class="text-2xl font-bold text-on-surface text-center leading-tight">Doctor at Home</span>
</button>
</section>
<!-- Informational / Upcoming Card -->
<section class="bg-surface-container-highest rounded-[1.5rem] p-6 mt-4">
<div class="flex items-center gap-4 mb-4">
<span class="material-symbols-outlined text-primary text-3xl">info</span>
<h2 class="text-xl font-bold text-on-surface">Upcoming Appointment</h2>
</div>
<div class="bg-surface-container-lowest rounded-xl p-5 shadow-sm">
<p class="text-lg font-bold text-on-surface">Dr. Sarah Jenkins - Cardiology</p>
<p class="text-lg text-on-surface-variant mt-1">Tomorrow at 10:00 AM</p>
<p class="text-md text-on-surface-variant mt-2">Room 302, North Wing</p>
</div>
</section>
</main>
<!-- Fixed Emergency Button Bottom Bar -->
<div class="fixed bottom-0 w-full px-4 py-6 bg-surface/90 backdrop-blur-md z-50 md:hidden">
<button class="w-full bg-error text-on-error rounded-[1.5rem] py-6 px-4 flex items-center justify-center gap-4 shadow-[0_10px_40px_rgba(186,26,26,0.2)] active:scale-95 transition-transform">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">emergency</span>
<span class="text-3xl font-black tracking-wide uppercase">Emergency Help</span>
</button>
</div>
</body></html>
