<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MediWay Patient Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#004e9f",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed-variant": "#00458e",
                        "surface-bright": "#f9f9fb",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#aac7ff",
                        "secondary-fixed-dim": "#abc7ff",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#d7e2ff",
                        "secondary": "#005ab7",
                        "inverse-on-surface": "#f0f0f2",
                        "on-primary-container": "#dfe8ff",
                        "on-surface-variant": "#414753",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f3f3f5",
                        "on-secondary-container": "#fefcff",
                        "surface-container-highest": "#e2e2e4",
                        "on-tertiary-container": "#cdecff",
                        "background": "#f9f9fb",
                        "surface-container-high": "#e8e8ea",
                        "error-container": "#ffdad6",
                        "surface": "#f9f9fb",
                        "error": "#ba1a1a",
                        "tertiary-fixed": "#c1e8ff",
                        "tertiary": "#005673",
                        "on-primary-fixed": "#001b3e",
                        "outline": "#727784",
                        "outline-variant": "#c1c6d5",
                        "on-tertiary-fixed": "#001e2b",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#007094",
                        "on-surface": "#1a1c1d",
                        "tertiary-fixed-dim": "#74d1ff",
                        "on-secondary-fixed": "#001b3f",
                        "primary-container": "#0066cc",
                        "inverse-surface": "#2f3132",
                        "surface-dim": "#d9dadc",
                        "primary-fixed-dim": "#aac7ff",
                        "on-tertiary-fixed-variant": "#004d67",
                        "primary-fixed": "#d7e3ff",
                        "on-background": "#1a1c1d",
                        "surface-variant": "#e2e2e4",
                        "surface-tint": "#005cba",
                        "on-secondary-fixed-variant": "#00458f",
                        "surface-container": "#eeeef0",
                        "secondary-container": "#0372e4"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter", "sans-serif"],
                        "display": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body antialiased selection:bg-primary-container selection:text-on-primary-container min-h-screen flex flex-col pt-16 pb-24 md:pb-0 md:pt-0">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-slate-50/80 dark:bg-slate-950/80 backdrop-blur-2xl shadow-xl shadow-blue-900/5 md:hidden">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-100/50 dark:hover:bg-slate-800/50 transition-all active:scale-95 duration-300 text-slate-500">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="text-xl font-bold tracking-tighter text-blue-900 dark:text-blue-100 font-sans tracking-tight font-medium">MediWay</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-100/50 dark:hover:bg-slate-800/50 transition-all active:scale-95 duration-300">
<img alt="User profile" class="w-8 h-8 rounded-full object-cover" data-alt="close up of a friendly person smiling in bright soft lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuArblMn1J2m5mDfwaEHRp2fj9hszy6snS0niK1TRoZE7LJ3NjjTeWnH_l9d_c993R9Er4BmJmC6YGRnO9QIriyrhQG49oJVKVL8_z-5TyvxyxRIIliqqcndQxTLzd9vqUjk7Ud0kca1XYBQBPMGNT1OXvzP3TRzoIXwyVdhHoUNzQnEf4WXGRBSi4o5dNrQaYklYq48OSYW4phVn_a9Cv9EsfIh_UGDJxQ5lgPC82dFmzMK0-AVia3O6NRE_lFGsnpIsaVhuuxFiA5C"/>
</button>
</header>
<!-- Main Content -->
<main class="flex-grow px-6 py-8 flex flex-col gap-6 md:hidden">
<!-- Greeting -->
<section class="flex flex-col gap-1 mt-2">
<p class="text-on-surface-variant text-sm font-label uppercase tracking-wider">Dashboard</p>
<h2 class="text-3xl font-display font-semibold tracking-tight text-on-surface">Good morning, Alex.</h2>
</section>
<!-- Proxy Payment CTA -->
<button class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary rounded-xl px-6 py-5 flex items-center justify-between shadow-lg shadow-primary/10 active:scale-[0.98] transition-transform">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center backdrop-blur-sm">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">payments</span>
</div>
<div class="text-left">
<h3 class="font-headline font-semibold text-lg text-white">Proxy Payment</h3>
<p class="text-white/80 text-sm font-body">Settle pending invoices instantly</p>
</div>
</div>
<span class="material-symbols-outlined text-white">chevron_right</span>
</button>
<!-- Today's Schedule (Bento Grid) -->
<section class="flex flex-col gap-4">
<h3 class="font-headline font-medium text-lg text-on-surface">Today's Schedule</h3>
<div class="grid grid-cols-1 gap-4">
<!-- Appointment Card -->
<div class="bg-surface-container-lowest rounded-xl p-5 shadow-[0_4px_24px_rgba(0,78,159,0.04)] relative overflow-hidden">
<div class="absolute top-0 left-0 w-1 h-full bg-primary rounded-l-xl"></div>
<div class="flex justify-between items-start mb-4">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary/10 text-primary flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
<div>
<h4 class="font-headline font-semibold text-on-surface text-base">Cardiology</h4>
<p class="text-sm text-on-surface-variant font-body">Dr. Sarah Jenkins</p>
</div>
</div>
<div class="text-right">
<p class="font-headline font-bold text-primary text-base">2:00 PM</p>
<p class="text-xs text-on-surface-variant font-body">In 3 hours</p>
</div>
</div>
<div class="flex gap-2">
<span class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full bg-surface-container-low text-xs font-medium text-on-surface-variant">
<span class="material-symbols-outlined text-[14px]">location_on</span> Room 302, West Wing
                        </span>
</div>
</div>
</div>
</section>
<!-- Quick Actions (Grid) -->
<section class="flex flex-col gap-4">
<h3 class="font-headline font-medium text-lg text-on-surface">Quick Actions</h3>
<div class="grid grid-cols-2 gap-4">
<!-- Action 1 -->
<button class="bg-surface-container-lowest rounded-xl p-4 flex flex-col items-center justify-center gap-3 shadow-[0_4px_20px_rgba(0,0,0,0.02)] hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<div class="w-12 h-12 rounded-full bg-secondary-fixed text-on-secondary-fixed-variant flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]">search</span>
</div>
<span class="font-body font-medium text-sm text-on-surface text-center">Find a Doctor</span>
</button>
<!-- Action 2 -->
<button class="bg-surface-container-lowest rounded-xl p-4 flex flex-col items-center justify-center gap-3 shadow-[0_4px_20px_rgba(0,0,0,0.02)] hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<div class="w-12 h-12 rounded-full bg-tertiary-fixed text-on-tertiary-fixed-variant flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]">calendar_add_on</span>
</div>
<span class="font-body font-medium text-sm text-on-surface text-center">Book Appt</span>
</button>
<!-- Action 3 -->
<button class="bg-surface-container-lowest rounded-xl p-4 flex flex-col items-center justify-center gap-3 shadow-[0_4px_20px_rgba(0,0,0,0.02)] hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<div class="w-12 h-12 rounded-full bg-primary-fixed text-on-primary-fixed-variant flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]">view_timeline</span>
</div>
<span class="font-body font-medium text-sm text-on-surface text-center">Timetable</span>
</button>
<!-- Action 4 -->
<button class="bg-surface-container-lowest rounded-xl p-4 flex flex-col items-center justify-center gap-3 shadow-[0_4px_20px_rgba(0,0,0,0.02)] hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<div class="w-12 h-12 rounded-full bg-surface-container text-on-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]">directions_car</span>
</div>
<span class="font-body font-medium text-sm text-on-surface text-center">Parking Info</span>
</button>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pt-3 pb-8 bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl rounded-t-[2rem] shadow-[0_-10px_40px_rgba(0,78,159,0.08)] md:hidden">
<!-- Home (Active) -->
<a class="flex flex-col items-center justify-center bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-200 rounded-[1.25rem] px-5 py-2.5 active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="text-[11px] font-semibold tracking-wide uppercase">Home</span>
</a>
<!-- Schedule -->
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-2.5 hover:text-blue-600 transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined mb-1">calendar_today</span>
<span class="text-[11px] font-semibold tracking-wide uppercase">Schedule</span>
</a>
<!-- Records -->
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-2.5 hover:text-blue-600 transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined mb-1">folder_managed</span>
<span class="text-[11px] font-semibold tracking-wide uppercase">Records</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-2.5 hover:text-blue-600 transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined mb-1">person</span>
<span class="text-[11px] font-semibold tracking-wide uppercase">Profile</span>
</a>
</nav>
</body></html>
