<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MediWay - Patient Navigation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary-fixed": "#d7e2ff",
                    "secondary-container": "#0372e4",
                    "on-secondary-fixed-variant": "#00458f",
                    "on-tertiary-container": "#cdecff",
                    "surface-dim": "#d9dadc",
                    "surface-container-low": "#f3f3f5",
                    "primary": "#004e9f",
                    "on-background": "#1a1c1d",
                    "surface-container": "#eeeef0",
                    "inverse-primary": "#aac7ff",
                    "secondary": "#005ab7",
                    "on-secondary": "#ffffff",
                    "error-container": "#ffdad6",
                    "surface-variant": "#e2e2e4",
                    "surface-container-highest": "#e2e2e4",
                    "outline": "#727784",
                    "tertiary-fixed": "#c1e8ff",
                    "inverse-surface": "#2f3132",
                    "secondary-fixed-dim": "#abc7ff",
                    "outline-variant": "#c1c6d5",
                    "surface-tint": "#005cba",
                    "primary-fixed": "#d7e3ff",
                    "on-tertiary": "#ffffff",
                    "on-primary-fixed": "#001b3e",
                    "surface-container-lowest": "#ffffff",
                    "on-primary-container": "#dfe8ff",
                    "inverse-on-surface": "#f0f0f2",
                    "on-secondary-container": "#fefcff",
                    "tertiary-fixed-dim": "#74d1ff",
                    "error": "#ba1a1a",
                    "surface-bright": "#f9f9fb",
                    "tertiary-container": "#007094",
                    "on-tertiary-fixed": "#001e2b",
                    "on-error-container": "#93000a",
                    "surface": "#f9f9fb",
                    "surface-container-high": "#e8e8ea",
                    "on-primary": "#ffffff",
                    "background": "#f9f9fb",
                    "primary-fixed-dim": "#aac7ff",
                    "on-surface-variant": "#414753",
                    "tertiary": "#005673",
                    "on-tertiary-fixed-variant": "#004d67",
                    "on-error": "#ffffff",
                    "on-secondary-fixed": "#001b3f",
                    "on-surface": "#1a1c1d",
                    "primary-container": "#0066cc",
                    "on-primary-fixed-variant": "#00458e"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "1.5rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          }
        }
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
        }
        .map-gradient-overlay {
            background: linear-gradient(to bottom, rgba(249, 249, 251, 1) 0%, rgba(249, 249, 251, 0) 15%, rgba(249, 249, 251, 0) 85%, rgba(249, 249, 251, 1) 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body selection:bg-primary-fixed selection:text-on-primary-fixed overflow-hidden">
<!-- Top Navigation Header (Suppressed FAB/SideNav for focused task) -->
<header class="bg-white/80 dark:bg-slate-950/80 backdrop-blur-xl docked full-width top-0 sticky z-50 shadow-sm dark:shadow-none">
<div class="flex justify-between items-center w-full px-6 py-4 max-w-full mx-auto">
<h1 class="text-xl font-bold tracking-tighter text-blue-900 dark:text-white">MediWay</h1>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="notifications">notifications</span>
<div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center overflow-hidden">
<img alt="Medical Staff Profile Avatar" class="w-full h-full object-cover" data-alt="close-up portrait of a friendly medical professional smiling with soft lighting in a clinical environment" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA8SFp5srfBNs6RHwGuikxKcEFgdPg2say_qAb6nGdZ3dCLpbmS4BqQd3zR2I-WYRs4jT-TyNsNdljt35br369IETh1tunbglneiJAwouyAAqxVB4vOYq497-N8o6WDKM_QaLxdhfSGa3DIA3VkcIiXZO7OIUiqp1-JQzCCR8zskTehuW3KI3qTsKOWIXTwW8xL8NKyB7L6QQtMeq9baaNkeC1wmAunGQ3SRYuRhkiuWua2xuTT6ExMG2yuyQztgSdcqzf1uw16MJkk"/>
</div>
</div>
</div>
<div class="bg-slate-100 dark:bg-slate-800 h-[1px] w-full"></div>
</header>
<main class="relative h-[calc(100vh-72px)] w-full overflow-hidden flex flex-col">
<!-- Step Indicator & Destination Card (Instruction 6.2) -->
<div class="absolute top-4 left-0 right-0 z-20 px-6">
<div class="bg-surface-container-lowest rounded-xl shadow-[0_20px_50px_rgba(0,78,159,0.12)] p-5 flex flex-col gap-4">
<div class="flex items-start justify-between">
<div>
<p class="text-on-surface-variant text-sm font-medium tracking-tight mb-1">다음 목적지</p>
<h2 class="text-xl font-bold text-primary tracking-tight">본관 2층 채혈실</h2>
</div>
<div class="bg-primary-container/10 px-3 py-2 rounded-xl flex flex-col items-center">
<span class="text-primary font-bold text-lg leading-tight">3분</span>
<span class="text-primary text-[10px] font-semibold">도보 거리</span>
</div>
</div>
<div class="flex items-center gap-3 py-2 bg-surface-container-low rounded-lg px-4">
<span class="material-symbols-outlined text-primary" data-icon="directions_walk">directions_walk</span>
<p class="text-on-surface text-sm font-medium">엘리베이터를 타고 2층으로 이동하세요.</p>
</div>
</div>
</div>
<!-- 2D Floor Plan Map (Instruction 6.3) -->
<div class="flex-grow relative bg-[#f1f3f5] overflow-hidden">
<!-- Simulated Map Canvas -->
<div class="absolute inset-0 z-0">
<img alt="2D Hospital Floor Plan Map" class="w-full h-full object-cover opacity-60" data-alt="clean 2D architectural floor plan of a hospital floor with soft blue and gray tones showing corridors and rooms" data-location="Seoul" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAGyDE4MNLw4nYnZPL5ToOopTdwk3sb3x1ITD4lms_in54VNmvDc-qexYNDktMkqFdlnH9e1_XOPBYnAmC1GYm3e_iXIINurNSXWhwMRgXOENq_Ql3J8Z1k99Hbmx3IOT8r6wLBcXaM-Ro6WBUluMQ3lJ8cZR-vf6BXapUKMXnvAPXFbY2Ljt6I0udDowP8JbQX8oMecgrtJz7bsmAOmhFWckEbSUKsb1rrrxxwmFjtklzWBJxjuNiRS35kV3pO5GtJs6HATnr1dj3u"/>
<!-- Path Overlay (SVG) -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" fill="none" viewbox="0 0 400 800" xmlns="http://www.w3.org/2000/svg">
<path d="M200 700C200 700 200 500 250 450C300 400 300 300 200 250C100 200 100 100 100 50" stroke="#004e9f" stroke-dasharray="1 12" stroke-linecap="round" stroke-width="6"></path>
<circle cx="200" cy="700" fill="#004e9f" r="8"></circle>
<path d="M100 50L110 65H90L100 50Z" fill="#ba1a1a"></path>
</svg>
<!-- Pulse Animation for current location -->
<div class="absolute bottom-[100px] left-1/2 -translate-x-1/2 w-6 h-6 bg-primary rounded-full ring-8 ring-primary/20 animate-pulse"></div>
</div>
<div class="absolute inset-0 map-gradient-overlay pointer-events-none"></div>
<!-- Map Controls -->
<div class="absolute right-6 top-1/2 -translate-y-1/2 flex flex-col gap-3">
<button class="w-12 h-12 rounded-full bg-white shadow-lg flex items-center justify-center text-primary active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
<button class="w-12 h-12 rounded-full bg-white shadow-lg flex items-center justify-center text-primary active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="remove">remove</span>
</button>
<button class="w-12 h-12 rounded-full bg-white shadow-lg flex items-center justify-center text-primary active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="my_location">my_location</span>
</button>
</div>
</div>
<!-- Bottom Action Sheet & Progress -->
<div class="bg-white/90 backdrop-blur-2xl rounded-t-[2.5rem] shadow-[0_-20px_60px_rgba(0,0,0,0.05)] px-8 pt-8 pb-10 z-30">
<!-- Step Progress Bar -->
<div class="flex items-center justify-between mb-8 relative">
<div class="absolute top-1/2 left-0 w-full h-[2px] bg-surface-container-high -translate-y-1/2 z-0"></div>
<div class="absolute top-1/2 left-0 w-1/3 h-[2px] bg-primary -translate-y-1/2 z-0"></div>
<div class="relative z-10 flex flex-col items-center gap-2">
<div class="w-4 h-4 rounded-full bg-primary ring-4 ring-primary-fixed"></div>
<span class="text-[10px] font-bold text-primary">원무과</span>
</div>
<div class="relative z-10 flex flex-col items-center gap-2">
<div class="w-4 h-4 rounded-full bg-surface-container-highest ring-4 ring-white"></div>
<span class="text-[10px] font-semibold text-on-surface-variant">채혈실</span>
</div>
<div class="relative z-10 flex flex-col items-center gap-2">
<div class="w-4 h-4 rounded-full bg-surface-container-highest ring-4 ring-white"></div>
<span class="text-[10px] font-semibold text-on-surface-variant">진료 대기</span>
</div>
</div>
<!-- Final Confirmation Action -->
<button class="w-full py-5 bg-gradient-to-r from-primary to-primary-container text-on-primary rounded-xl font-bold text-lg shadow-lg shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-3">
<span class="material-symbols-outlined" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                도착했습니다
            </button>
<p class="text-center text-on-surface-variant text-xs mt-6 font-medium">
                길을 찾기 어려우신가요? <span class="text-primary underline cursor-pointer">직원 호출하기</span>
</p>
</div>
</main>
<!-- Navigation Shell (BottomNavBar) -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pt-3 pb-8 bg-white/90 dark:bg-slate-950/90 backdrop-blur-2xl z-50">
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-2 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined mb-1" data-icon="explore">explore</span>
<span class="text-[11px] font-semibold Inter">Live Map</span>
</div>
<div class="flex flex-col items-center justify-center bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 rounded-2xl px-5 py-2 active:scale-90 duration-300">
<span class="material-symbols-outlined mb-1" data-icon="near_me">near_me</span>
<span class="text-[11px] font-semibold Inter">Wayfinding</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-2 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined mb-1" data-icon="calendar_today">calendar_today</span>
<span class="text-[11px] font-semibold Inter">Appointments</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-2 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="text-[11px] font-semibold Inter">My Health</span>
</div>
</nav>
</body></html>
