<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MediWay Plus Ultra - Senior Mode</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#f9f9fb",
                        "on-primary-fixed-variant": "#00458e",
                        "on-primary-fixed": "#001b3e",
                        "error-container": "#ffdad6",
                        "surface-container-highest": "#e2e2e4",
                        "secondary-fixed-dim": "#abc7ff",
                        "surface-bright": "#f9f9fb",
                        "primary-fixed-dim": "#aac7ff",
                        "outline": "#727784",
                        "on-secondary-fixed-variant": "#00458f",
                        "surface-variant": "#e2e2e4",
                        "secondary-fixed": "#d7e2ff",
                        "on-tertiary-fixed": "#001e2b",
                        "surface-container-low": "#f3f3f5",
                        "outline-variant": "#c1c6d5",
                        "tertiary-fixed": "#c1e8ff",
                        "secondary-container": "#0372e4",
                        "on-secondary-container": "#fefcff",
                        "inverse-primary": "#aac7ff",
                        "on-background": "#1a1c1d",
                        "on-tertiary-fixed-variant": "#004d67",
                        "secondary": "#005ab7",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#f0f0f2",
                        "primary-container": "#0066cc",
                        "surface-dim": "#d9dadc",
                        "on-surface": "#1a1c1d",
                        "primary": "#004e9f",
                        "on-secondary-fixed": "#001b3f",
                        "on-primary": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface-container-high": "#e8e8ea",
                        "on-primary-container": "#dfe8ff",
                        "tertiary-container": "#007094",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#74d1ff",
                        "surface-container": "#eeeef0",
                        "error": "#ba1a1a",
                        "background": "#f9f9fb",
                        "tertiary": "#005673",
                        "on-error": "#ffffff",
                        "inverse-surface": "#2f3132",
                        "surface-tint": "#005cba",
                        "primary-fixed": "#d7e3ff",
                        "on-tertiary-container": "#cdecff",
                        "on-surface-variant": "#414753"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "display": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #f9f9fb; color: #1a1c1d; }
        .glass-panel {
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
        }
        .btn-gradient {
            background: linear-gradient(135deg, #004e9f 0%, #0066cc 100%);
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col pt-20">
<!-- TopNavBar -->
<nav class="fixed top-0 w-full z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl shadow-sm shadow-blue-900/5">
<div class="flex items-center justify-between px-8 h-20 w-full max-w-[1920px] mx-auto bg-slate-100 dark:bg-slate-800">
<div class="flex items-center gap-4">
<span class="text-3xl font-black tracking-tighter text-blue-900 dark:text-blue-50">MediWay</span>
<span class="text-lg font-semibold text-primary ml-2 bg-primary-fixed px-3 py-1 rounded-full">Senior Mode</span>
</div>
<div class="hidden md:flex gap-8 items-center font-inter tracking-tight leading-relaxed text-lg">
<a class="text-blue-700 dark:text-blue-400 font-semibold border-b-[3px] border-blue-700 dark:border-blue-400 pb-1" href="#">Home</a>
<a class="text-slate-500 dark:text-slate-400 hover:text-blue-600 transition-colors hover:bg-slate-50/50 dark:hover:bg-slate-800/50 rounded-lg px-2 py-1" href="#">Outpatient</a>
<a class="text-slate-500 dark:text-slate-400 hover:text-blue-600 transition-colors hover:bg-slate-50/50 dark:hover:bg-slate-800/50 rounded-lg px-2 py-1" href="#">Inpatient</a>
<a class="text-slate-500 dark:text-slate-400 hover:text-blue-600 transition-colors hover:bg-slate-50/50 dark:hover:bg-slate-800/50 rounded-lg px-2 py-1" href="#">Check-up</a>
<a class="text-slate-500 dark:text-slate-400 hover:text-blue-600 transition-colors hover:bg-slate-50/50 dark:hover:bg-slate-800/50 rounded-lg px-2 py-1" href="#">Guidance</a>
</div>
<div class="flex items-center gap-6">
<button class="text-on-surface hover:text-primary transition-colors">
<span class="material-symbols-outlined text-3xl" data-icon="notifications">notifications</span>
</button>
<img alt="User Profile" class="w-12 h-12 rounded-full object-cover border-2 border-white shadow-sm" data-alt="Portrait of a smiling elderly woman with silver hair, warm soft lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDHVG2QOJX9FqSoZJmCdGIugVn_3OMWP9C9iQ-BaXmuPJ3NEz0jH8G2YzwUXgHsHsBRagXGDuxpyK6WYnYHEjhzvX6uH-TTieOEZiwiI-TGEO-AVPVlUjOgJn0vdBzXc0WNJX_s30fusSKEIHYgk7sgu88NX5OZ9EeEpYbwRzArAt5vkjw9P8GpPkQVpyPsEgZX0c4ot_kjhnGkGY3leHKojlN42xNO_6UghOUy4tX8BxO7OdAyjyuCRHr0Ai-SeM1V5qS9QoN-831-"/>
</div>
</div>
</nav>
<main class="flex-grow container mx-auto px-4 md:px-8 py-8 max-w-5xl">
<!-- Welcome Section -->
<section class="mb-12 text-center md:text-left flex flex-col md:flex-row items-center justify-between gap-8 bg-surface-container-lowest p-8 rounded-3xl shadow-[0_8px_30px_rgb(0,78,159,0.05)]">
<div>
<h1 class="text-4xl md:text-5xl font-bold tracking-tight text-on-surface mb-4">Hello, <span class="text-primary">Maria</span></h1>
<p class="text-xl text-on-surface-variant leading-relaxed">What would you like to do today? <br/>Tap a big button below.</p>
</div>
<div class="bg-surface-container-low p-6 rounded-2xl flex items-center gap-4 w-full md:w-auto">
<div class="bg-white p-3 rounded-xl shadow-sm">
<span class="material-symbols-outlined text-4xl text-primary" data-icon="event_available">event_available</span>
</div>
<div>
<p class="text-sm font-semibold text-on-surface-variant uppercase tracking-wider">Next Visit</p>
<p class="text-2xl font-bold text-on-surface">Tomorrow, 10:00 AM</p>
<p class="text-lg text-primary font-medium">Dr. Smith - Cardiology</p>
</div>
</div>
</section>
<!-- Main Actions Grid -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
<!-- Reservation -->
<button class="group bg-surface-container-lowest rounded-3xl p-8 flex flex-col items-center justify-center gap-6 shadow-[0_4px_20px_rgb(0,0,0,0.03)] hover:shadow-[0_8px_30px_rgb(0,78,159,0.08)] transition-all duration-300 active:scale-[0.98]">
<div class="w-24 h-24 rounded-full bg-secondary-fixed flex items-center justify-center group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined text-5xl text-primary" data-icon="calendar_month" data-weight="fill" style="font-variation-settings: 'FILL' 1;">calendar_month</span>
</div>
<div class="text-center">
<h2 class="text-3xl font-bold text-on-surface mb-2">Book a Visit</h2>
<p class="text-xl text-on-surface-variant">Make a new appointment</p>
</div>
</button>
<!-- Wayfinding -->
<button class="group bg-surface-container-lowest rounded-3xl p-8 flex flex-col items-center justify-center gap-6 shadow-[0_4px_20px_rgb(0,0,0,0.03)] hover:shadow-[0_8px_30px_rgb(0,78,159,0.08)] transition-all duration-300 active:scale-[0.98]">
<div class="w-24 h-24 rounded-full bg-tertiary-fixed flex items-center justify-center group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined text-5xl text-tertiary" data-icon="directions_walk" data-weight="fill" style="font-variation-settings: 'FILL' 1;">directions_walk</span>
</div>
<div class="text-center">
<h2 class="text-3xl font-bold text-on-surface mb-2">Find My Way</h2>
<p class="text-xl text-on-surface-variant">Map &amp; directions inside hospital</p>
</div>
</button>
<!-- Queue -->
<button class="group bg-surface-container-lowest rounded-3xl p-8 flex flex-col items-center justify-center gap-6 shadow-[0_4px_20px_rgb(0,0,0,0.03)] hover:shadow-[0_8px_30px_rgb(0,78,159,0.08)] transition-all duration-300 active:scale-[0.98]">
<div class="w-24 h-24 rounded-full bg-secondary-fixed flex items-center justify-center group-hover:bg-primary-fixed transition-colors relative">
<span class="material-symbols-outlined text-5xl text-primary" data-icon="confirmation_number" data-weight="fill" style="font-variation-settings: 'FILL' 1;">confirmation_number</span>
<span class="absolute -top-2 -right-2 bg-error text-white text-xl font-bold w-10 h-10 rounded-full flex items-center justify-center border-4 border-white shadow-sm">3</span>
</div>
<div class="text-center">
<h2 class="text-3xl font-bold text-on-surface mb-2">My Turn</h2>
<p class="text-xl text-on-surface-variant">Check waiting line number</p>
</div>
</button>
<!-- Call / Remote -->
<button class="group bg-surface-container-lowest rounded-3xl p-8 flex flex-col items-center justify-center gap-6 shadow-[0_4px_20px_rgb(0,0,0,0.03)] hover:shadow-[0_8px_30px_rgb(0,78,159,0.08)] transition-all duration-300 active:scale-[0.98]">
<div class="w-24 h-24 rounded-full bg-tertiary-fixed flex items-center justify-center group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined text-5xl text-tertiary" data-icon="video_call" data-weight="fill" style="font-variation-settings: 'FILL' 1;">video_call</span>
</div>
<div class="text-center">
<h2 class="text-3xl font-bold text-on-surface mb-2">Doctor at Home</h2>
<p class="text-xl text-on-surface-variant">Video call with a doctor</p>
</div>
</button>
</section>
<!-- Emergency CTA -->
<section class="mt-8 mb-16">
<button class="w-full bg-error-container hover:bg-[#ffc1ba] rounded-[2rem] p-8 flex items-center justify-center gap-6 transition-all duration-300 active:scale-[0.99] shadow-sm">
<div class="bg-error w-20 h-20 rounded-full flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-5xl text-white" data-icon="emergency" data-weight="fill" style="font-variation-settings: 'FILL' 1;">emergency</span>
</div>
<div class="text-left">
<h2 class="text-4xl font-black text-on-error-container mb-1">EMERGENCY HELP</h2>
<p class="text-2xl font-medium text-error">Call staff immediately</p>
</div>
</button>
</section>
</main>
</body></html>
