# v4.7 C-3 — AJIN AI Assistant Slack 앱 매니페스트
# 사용법:
#   1. https://api.slack.com/apps?new_app=1 → "From an app manifest" 선택
#   2. 워크스페이스 선택 → 이 YAML 내용 붙여넣기
#   3. 생성 후 Signing Secret 을 `.env` 의 SLACK_SIGNING_SECRET 에 저장
#   4. Install to Workspace → Bot Token 발급(SLACK_BOT_TOKEN, 선택)
#   5. 백엔드 배포 URL 로 슬래시 커맨드 Request URL 갱신: https://<host>/slack/command
display_information:
  name: AJIN AI
  description: AJIN Industry 사내 AI 업무 도우미 - SOP / 용어 / 규제 / 협업 Q&A
  background_color: "#0b0b0b"

features:
  bot_user:
    display_name: AJIN AI
    always_online: true

  slash_commands:
    - command: /ajin
      url: https://ajin-cb.web.app/slack/command
      description: AJIN AI Assistant - 사내 SOP / 용어 / 규제 질의
      usage_hint: ask <질문>  /  help
      should_escape: false

oauth_config:
  scopes:
    bot:
      - chat:write
      - commands

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
