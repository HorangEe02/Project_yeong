  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 필요}
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data
  #   networks: [ajin_net]
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ajin"]
  #     interval: 5s
  #     retries: 10

volumes:
  ollama-large-models:
  ollama-fast-models:
