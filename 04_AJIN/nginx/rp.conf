# AJIN Compliance — Reverse Proxy (Phase 1).
# /api/* → backend:8080
# /     → frontend:80 (정적 SPA)
# /healthz → backend:/api/health (LB / Cloud Run health check)

upstream backend_upstream {
    server backend:8080;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:80;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 보안 헤더
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 본문 크기 (파일 업로드 대응 — 백엔드 5MB 정책 대비 여유)
    client_max_body_size 10M;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    # API
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # SSE / streaming endpoint (chunked, no buffer)
    location ~ ^/api/(sse|stream) {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
    }

    # LB / Cloud Run health check (backend /api/health 으로 alias)
    location = /healthz {
        proxy_pass http://backend_upstream/api/health;
        proxy_set_header Host $host;
    }

    # SPA — 정적 frontend
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }
}
