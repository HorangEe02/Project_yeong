# AJIN Compliance — Phase 1 Docker Compose (Mac local).
#
# 흐름: nginx-rp(80) → backend:8080 (FastAPI) + frontend:80 (정적 SPA)
#       backend → host.docker.internal:11434 (Mac 호스트 Ollama, Metal GPU)
#       backend → redis:6379 (LLM 응답 cache, P5+ 도입)
#
# 사용법:
#   make setup         # 호스트 Ollama 셋업 + .env.docker 복사
#   make up            # docker compose up -d --build
#   make logs          # tail
#   make test          # 컨테이너 안 pytest
#   make down          # 정지
#
# Phase 2 / 3 진입 시 ollama / postgres service 의 comment 해제 (override 파일 사용 권장).

name: ajin-compliance

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: slim                                    # 기존 multi-stage 의 slim 단계
    image: ajin-backend:phase1
    env_file:
      - path: .env
        required: false                              # 없어도 시작 (compose v2.24+)
      - path: .env.docker
        required: false
    environment:
      # ★ Phase 1 — Mac 호스트 Ollama 사용 (Apple Silicon Metal GPU 활용)
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      LLM_ROUTER_PRIMARY: ollama
      EMBEDDING_BACKEND: ollama
      FEATURE_B_BLOCK_GEMINI: "true"
      REDIS_URL: redis://redis:6379/0
      PORT: "8080"
    extra_hosts:
      # Linux 호환 (Mac Docker Desktop 은 자동, 명시해도 무해)
      - "host.docker.internal:host-gateway"
    volumes:
      # SQLite / 캐시 / 로그 영속 — 호스트 디렉토리 그대로 사용
      - ./data:/app/data
      - ./logs:/app/logs
      # Phase B — Vertex SA key (read-only, GOOGLE_APPLICATION_CREDENTIALS 가 가리킴)
      - ~/.config/gcloud/ajin-compliance:/secrets:ro
    depends_on:
      redis:
        condition: service_healthy
    networks: [ajin_net]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api          # nginx-rp 가 /api 를 backend 로 forward
    image: ajin-frontend:phase1
    networks: [ajin_net]
    depends_on:
      - backend
    restart: unless-stopped
    # frontend Dockerfile 의 healthcheck (wget localhost) 가 IPv6 race 로 false-unhealthy
    # 보고함 — 127.0.0.1 명시 + start_period 추가로 override
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks: [ajin_net]
    restart: unless-stopped

  rp:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"                          # 외부 접근: http://localhost:8080
    volumes:
      - ./nginx/rp.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks: [ajin_net]
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 명시 (IPv6 미응답 회피) + start_period (nginx 기동 시간)
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─── Phase 1.5 / Phase 2 — NVIDIA GPU 환경에서 활성 ──────────────
  # ollama:
  #   image: ollama/ollama:latest
  #   deploy:
  #     resources:
  #       reservations:
  #         devices: [{driver: nvidia, capabilities: [gpu]}]
  #   volumes:
  #     - ollama-models:/root/.ollama
  #   networks: [ajin_net]
  #   healthcheck:
  #     test: ["CMD", "curl", "-fsS", "http://localhost:11434/api/tags"]
  #     interval: 10s

  # ─── Phase 2 / 3 — sqlite → PostgreSQL 마이그 시 활성 ─────────
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: ajin
  #     POSTGRES_USER: ajin
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data
  #   networks: [ajin_net]
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ajin"]

volumes:
  redis-data:
  # ollama-models:
  # pg-data:

networks:
  ajin_net:
    driver: bridge
